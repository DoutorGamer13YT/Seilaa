
name: Criar APK para Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Atlas APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando ZIP do projeto..."

          ZIP_FILE=$(find . -maxdepth 2 \
            -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Nenhum arquivo ZIP encontrado!"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Projeto extraido com sucesso."

          find extracted -maxdepth 4 -type f | head -60

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          echo "Localizando settings.gradle..."

          PROJECT_FILE=$(find extracted \
            -maxdepth 8 \
            -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Projeto Android nao encontrado no ZIP!"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado em: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Modulo app nao encontrado!"
            exit 1
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar projeto
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Diretorio atual:"
          pwd

          echo "Arquivos do projeto:"
          ls -la

          test -f settings.gradle.kts || test -f settings.gradle

          test -f app/build.gradle.kts || test -f app/build.gradle

          gradle --version

      - name: Compilar APK Atlas
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando APK compilado..."

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" -print

          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Android-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Executar testes unitarios
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Salvar relatorios de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Build-Reports
          path: extracted/**/build/reports/**
          if-no-files-found: ignore
