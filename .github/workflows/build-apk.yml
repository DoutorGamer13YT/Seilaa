name: Infinity Clicker V3 - Criar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilador Infinity Clicker
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nao encontrado"
            exit 1
          fi

          echo "Instalando Android SDK 36..."

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Verificando SDK..."

          test -f "$SDK_DIR/platforms/android-36/android.jar"

          echo "Android SDK configurado!"

      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            PROJECT_DIR="."
          else
            SETTINGS_FILE="$(find . -maxdepth 4 -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/.gradle/*' \
              -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::Projeto Android nao encontrado."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado em: $PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Configurar Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "::error::Gradle Wrapper nao encontrado."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version

      - name: Compilar Infinity Clicker V3
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            --stacktrace \
            --console=plain \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK nao foi gerado."
            exit 1
          fi

          cp "$APK" dist/Infinity-Clicker-V3.apk

          ls -lh dist/

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Clicker-V3-APK
          path: dist/Infinity-Clicker-V3.apk
          retention-days: 30
          if-no-files-found: error
