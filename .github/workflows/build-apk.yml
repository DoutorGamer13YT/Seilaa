
name: Compilar APK Dmap

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Criar APK do Dmap
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE=$(find . -maxdepth 8 -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "./.git/*" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f \
              -iname "*.zip" -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Projeto ou ZIP nao encontrado!"
              exit 1
            fi

            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_FILE=$(find extracted -maxdepth 12 \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Projeto Gradle nao encontrado!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Modulo app nao encontrado!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nao encontrado!"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          "$SDKMANAGER" --version

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew

            ./gradlew :app:assembleDebug \
              --no-daemon \
              --stacktrace \
              --console=plain
          else
            gradle :app:assembleDebug \
              --no-daemon \
              --stacktrace \
              --console=plain
          fi

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "::error::APK nao encontrado!"
            exit 1
          fi

          mkdir -p apk-output

          cp "$APK_FILE" apk-output/Dmap-debug.apk

          echo "APK gerado com sucesso!"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Dmap-Android-APK
          path: apk-output/Dmap-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Executar testes
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            ./gradlew :app:testDebugUnitTest \
              --no-daemon \
              --console=plain
          else
            gradle :app:testDebugUnitTest \
              --no-daemon \
              --console=plain
          fi

      - name: Salvar relatorios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Dmap-Build-Reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
