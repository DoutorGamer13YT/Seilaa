name: Criar APK para Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Atlas APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    defaults:
      run:
        shell: bash
        working-directory: atlas

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK 35
        working-directory: .
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar arquivos do Atlas
        run: |
          echo "Verificando projeto..."
          pwd
          ls -la

          test -f settings.gradle.kts
          test -f app/build.gradle.kts

          gradle --version

      - name: Compilar APK Atlas
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Executar testes unitarios
        run: |
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verificar APK gerado
        run: |
          echo "Procurando APK..."
          ls -lh app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Android-APK
          path: atlas/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Salvar relatorios de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Build-Reports
          path: |
            atlas/app/build/reports/
            atlas/build/reports/
          if-no-files-found: ignore
