
name: Criar APK para Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Atlas APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Aceitar licencas Android
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Executar testes
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Salvar relatorios de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Build-Reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
