name: Infinity Clicker V3 - Criar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilador Infinity Clicker
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" \
              -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nao encontrado."
            exit 1
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -f "$SDK_DIR/platforms/android-36/android.jar"

          echo "Android SDK configurado!"

      - name: Localizar ou extrair projeto
        shell: bash
        run: |
          set -euo pipefail

          echo "Arquivos do repositorio:"
          ls -lah

          PROJECT_DIR=""

          SETTINGS="$(find . -maxdepth 10 -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Procurando projeto dentro de arquivos ZIP..."

            mkdir -p "$RUNNER_TEMP/infinity-extracted"

            while IFS= read -r -d '' ZIP_FILE; do
              echo "Verificando ZIP: $ZIP_FILE"

              ZIP_NAME="$(basename "$ZIP_FILE" .zip)"
              DEST="$RUNNER_TEMP/infinity-extracted/$ZIP_NAME"

              mkdir -p "$DEST"

              if ! unzip -q "$ZIP_FILE" -d "$DEST"; then
                echo "::warning::Falha ao extrair $ZIP_FILE"
                continue
              fi

              SETTINGS="$(find "$DEST" -maxdepth 12 -type f \
                \( -name settings.gradle.kts -o -name settings.gradle \) \
                -print -quit)"

              if [ -n "$SETTINGS" ]; then
                PROJECT_DIR="$(dirname "$SETTINGS")"
                break
              fi

            done < <(find . -maxdepth 10 -type f \
              -iname '*.zip' -print0)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Android nao encontrado."
            echo "Envie o projeto completo ou um ZIP contendo settings.gradle.kts."
            echo "Arquivos encontrados:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado em: $PROJECT_DIR"
          ls -lah "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Pasta app nao encontrada."
            exit 1
          fi

      - name: Preparar Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "::error::Arquivo gradlew nao encontrado."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            --stacktrace \
            --console=plain \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Preparar APK para download
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::APK nao encontrado."
            exit 1
          fi

          cp "$APK" dist/Infinity-Clicker-V3.apk

          echo "APK gerado:"
          ls -lh dist/

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Clicker-V3-APK
          path: dist/Infinity-Clicker-V3.apk
          retention-days: 30
          if-no-files-found: error
