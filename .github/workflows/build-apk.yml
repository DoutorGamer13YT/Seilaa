name: Infinity Clicker V3 - Criar APK

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  build:
    name: Compilar Infinity Clicker
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nao encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

          test -f "$SDK_DIR/platforms/android-36/android.jar"

      - name: Preparar Gradle
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew

          chmod +x gradlew

          ./gradlew --version

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            --stacktrace \
            --console=plain \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::APK nao encontrado."
            exit 1
          fi

          cp "$APK" dist/Infinity-Clicker-V3-debug.apk

          ls -lh dist/

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Clicker-V3-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
