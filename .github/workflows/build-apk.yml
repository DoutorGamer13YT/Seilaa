
name: Dmap - Criar APK para Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: dmap-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Dmap APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GRADLE_VERSION: "8.13"
      JAVA_VERSION: "17"
      ANDROID_API: "36"
      BUILD_TOOLS: "35.0.0"
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.jvmargs=-Xmx3g
        -Dfile.encoding=UTF-8

    steps:

      # 1. BAIXAR PROJETO

      - name: Baixar codigo-fonte
        uses: actions/checkout@v4

      # 2. CONFIGURAR JAVA

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. CONFIGURAR SDK SEM ACTION PROBLEMATICA

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Configurando Android SDK..."

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK nao encontrado"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | sort -V \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nao encontrado"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK localizado."
          "$SDKMANAGER" --version

      # 4. ACEITAR LICENCAS AUTOMATICAMENTE

      - name: Aceitar licencas Android
        shell: bash
        run: |
          set -euo pipefail

          echo "Aceitando licencas..."

          set +o pipefail
          yes | "$SDKMANAGER" --licenses \
            > "$RUNNER_TEMP/sdk-licenses.log" 2>&1
          RESULT=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Falha ao aceitar licencas"
            tail -n 30 "$RUNNER_TEMP/sdk-licenses.log"
            exit 1
          fi

          echo "Licencas aceitas."

      # 5. INSTALAR COMPONENTES NECESSARIOS

      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          echo "Instalando Android SDK..."

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Verificando instalacao..."

          test -f \
            "$ANDROID_HOME/platforms/android-${ANDROID_API}/android.jar"

          test -d \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          echo "Android SDK instalado corretamente."

      # 6. CONFIGURAR GRADLE

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # 7. LOCALIZAR PROJETO

      - name: Localizar projeto Dmap
        shell: bash
        run: |
          set -euo pipefail

          if [ -f settings.gradle.kts ]; then
            PROJECT_DIR="."
          elif [ -f dmap/settings.gradle.kts ]; then
            PROJECT_DIR="dmap"
          elif [ -f atlas/settings.gradle.kts ]; then
            PROJECT_DIR="atlas"
          elif [ -f extracted/atlas/settings.gradle.kts ]; then
            PROJECT_DIR="extracted/atlas"
          else
            echo "::error::Projeto Gradle nao encontrado"
            find . -name "settings.gradle.kts" -print
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Modulo app nao encontrado"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado: $PROJECT_DIR"

      # 8. CONFIGURAR CHAVES DE API

      - name: Configurar APIs do Dmap
        shell: bash
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          MAP_STYLE_URL: ${{ secrets.MAP_STYLE_URL }}
          MAPKIT_TOKEN_URL: ${{ secrets.MAPKIT_TOKEN_URL }}
          MAPKIT_WEB_ORIGIN: ${{ secrets.MAPKIT_WEB_ORIGIN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          target = root / "local.properties"

          keys = [
              "GEOAPIFY_API_KEY",
              "MAP_STYLE_URL",
              "MAPKIT_TOKEN_URL",
              "MAPKIT_WEB_ORIGIN"
          ]

          def escape(value):
              return (
                  value.replace("\\", "\\\\")
                  .replace("\r", "")
                  .replace("\n", "")
              )

          lines = []

          for key in keys:
              value = os.environ.get(key, "")
              lines.append(f"{key}={escape(value)}")

              if not value:
                  print(f"AVISO: {key} nao configurada")

          target.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          target.chmod(0o600)

          print("Configuracoes criadas.")
          PY

      # 9. SELECIONAR GRADLE

      - name: Preparar Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f gradlew ] && \
             [ -f gradle/wrapper/gradle-wrapper.jar ] && \
             [ -f gradle/wrapper/gradle-wrapper.properties ]; then

            chmod +x gradlew

            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            echo "Usando Gradle Wrapper."

          else

            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
            echo "Usando Gradle 8.13 instalado."

          fi

      # 10. DIAGNOSTICO DO AMBIENTE

      - name: Diagnosticar ambiente
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-logs

          {
            echo "=== JAVA ==="
            java -version

            echo "=== GRADLE ==="
            cd "$PROJECT_DIR"
            "$GRADLE_CMD" --version

            echo "=== ANDROID SDK ==="
            echo "$ANDROID_HOME"

            echo "=== ARQUIVOS ==="
            ls -la

          } 2>&1 | tee \
            "$GITHUB_WORKSPACE/build-logs/environment.log"

      # 11. VALIDAR GRADLE

      - name: Verificar configuracao Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          "$GRADLE_CMD" help \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/build-logs/gradle-check.log"

      # 12. COMPILAR APK

      - name: Compilar Dmap Debug
        id: compile
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Iniciando compilacao..."

          "$GRADLE_CMD" :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/build-logs/build.log"

          echo "Compilacao finalizada."

      # 13. LOCALIZAR E VERIFICAR APK

      - name: Verificar APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Pasta do APK nao encontrada"
            exit 1
          fi

          APK_FILE=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "::error::APK nao gerado"
            exit 1
          fi

          if [ ! -s "$APK_FILE" ]; then
            echo "::error::APK vazio"
            exit 1
          fi

          mkdir -p output

          cp "$APK_FILE" output/Dmap-debug.apk

          cd output

          sha256sum Dmap-debug.apk \
            > Dmap-debug.sha256

          echo "APK verificado."
          ls -lh Dmap-debug.apk

      # 14. PUBLICAR APK

      - name: Publicar APK Dmap
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dmap-Android-APK
          path: output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # 15. PUBLICAR LOGS EM CASO DE ERRO

      - name: Salvar logs de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Dmap-Diagnostic-Logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14

      # 16. RELATORIO FINAL

      - name: Relatorio da compilacao
        if: always()
        shell: bash
        run: |
          {
            echo "## Dmap - Resultado da Build"
            echo ""
            echo "| Componente | Versao |"
            echo "|---|---|"
            echo "| Java | 17 |"
            echo "| Gradle instalado | 8.13 |"
            echo "| Android SDK | 36 |"
            echo "| Build Tools | 35.0.0 |"
            echo ""
            echo "Compilacao: ${{ steps.compile.outcome }}"
            echo ""
            echo "Verificacao APK: ${{ steps.apk.outcome }}"
            echo ""
            echo "APK disponivel nos artefatos se a build concluir."
          } >> "$GITHUB_STEP_SUMMARY"
