name: Infinity Clicker V3 - Criar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar Infinity Clicker V3
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -f "$SDK_DIR/platforms/android-36/android.jar"

      - name: Encontrar projeto no ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Nenhum arquivo ZIP foi encontrado no repositório."
            exit 1
          fi

          echo "Extraindo: $ZIP_FILE"

          EXTRACT_DIR="$RUNNER_TEMP/infinity-clicker"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -maxdepth 12 -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Projeto Android não encontrado dentro do ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Pasta app não encontrada."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::Arquivo gradlew não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado em: $PROJECT_DIR"

      - name: Preparar Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --version

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            --stacktrace \
            --console=plain \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::APK não foi gerado."
            exit 1
          fi

          mkdir -p dist
          cp "$APK" dist/Infinity-Clicker-V3.apk

          ls -lh dist/

      - name: Publicar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Clicker-V3-APK
          path: dist/Infinity-Clicker-V3.apk
          retention-days: 30
          if-no-files-found: error
