
name: Compilar APK Dmap

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Dmap APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando projeto Android..."

          PROJECT_FILE=$(find . -maxdepth 8 -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "./.git/*" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Projeto nao encontrado diretamente."
            echo "Procurando arquivo ZIP..."

            ZIP_FILE=$(find . -maxdepth 3 -type f \
              -iname "*.zip" -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Nenhum projeto Android ou ZIP encontrado!"
              exit 1
            fi

            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_FILE=$(find extracted -maxdepth 12 -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Projeto Gradle nao encontrado!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Modulo app nao encontrado!"
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK Dmap
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug \
              --no-daemon \
              --stacktrace \
              --console=plain
          else
            echo "Gradle Wrapper nao encontrado."
            echo "Utilizando Gradle 8.9."

            gradle :app:assembleDebug \
              --no-daemon \
              --stacktrace \
              --console=plain
          fi

      - name: Localizar APK compilado
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "::error::Nenhum APK foi gerado!"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/Dmap-debug.apk"

          echo "APK preparado com sucesso."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Dmap-Android-APK
          path: apk-output/Dmap-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Executar testes unitarios
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest \
              --no-daemon \
              --console=plain
          else
            gradle :app:testDebugUnitTest \
              --no-daemon \
              --console=plain
          fi

      - name: Salvar relatorios de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Dmap-Build-Reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
