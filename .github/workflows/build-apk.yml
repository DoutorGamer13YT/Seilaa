
name: Infinity Clicker V3 - Compilar APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    name: Gerar APK instalavel
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: Conferir arquivos essenciais
        shell: bash
        run: |
          set -euo pipefail
          for arquivo in \
            settings.gradle.kts \
            build.gradle.kts \
            app/build.gradle.kts \
            gradlew \
            gradle/wrapper/gradle-wrapper.jar \
            gradle/wrapper/gradle-wrapper.properties; do
            if [ ! -f "$arquivo" ]; then
              echo "::error::Arquivo ausente: $arquivo"
              exit 1
            fi
          done
          chmod +x gradlew

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle e cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar SDK 36 e Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sucesso=0
          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa/3"
            if sdkmanager --install \
              'platforms;android-36' \
              'build-tools;35.0.0' \
              'build-tools;36.0.0'; then
              sucesso=1
              break
            fi
            if [ "$tentativa" -lt 3 ]; then
              sleep 15
            fi
          done

          if [ "$sucesso" -ne 1 ]; then
            echo '::error::Falha na instalacao do SDK.'
            exit 1
          fi

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_DIR" ] || \
             [ ! -f "$SDK_DIR/platforms/android-36/android.jar" ]; then
            echo '::error::SDK 36 nao encontrado.'
            exit 1
          fi

      - name: Preparar Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          for tentativa in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$tentativa" -lt 3 ]; then
              sleep 10
            fi
          done
          echo '::error::Falha ao iniciar Gradle.'
          exit 1

      - name: Compilar APK Debug
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            --stacktrace \
            --console=plain \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:assembleDebug

      - name: Validar APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          APK_ORIGINAL="$(find \
            app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK_ORIGINAL" ] || \
             [ ! -s "$APK_ORIGINAL" ]; then
            echo '::error::APK nao encontrado.'
            exit 1
          fi

          cp "$APK_ORIGINAL" \
            dist/Infinity-Clicker-V3-debug.apk

          sha256sum \
            dist/Infinity-Clicker-V3-debug.apk \
            > dist/SHA256.txt

          ls -lh dist/

      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-Clicker-V3-APK
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Executar testes
        id: testes
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            --stacktrace \
            --console=plain \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:testDebugUnitTest

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-Clicker-V3-Testes
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Avisar sobre testes com falha
        if: steps.testes.outcome == 'failure'
        run: |
          echo '::warning::APK gerado, mas existem testes com falha.'
